[package]
name = "podnet"
version.workspace = true
edition = "2021"
rust-version = "1.99"
license = "0BSD"
build = "build.rs"
description = "podnet: bring your own network to restricted hosts. Tunnels, WARP, relays, pods, virtual networks, file serving and transfer, from one static binary."
repository = "https://github.com/PodUtils/podnet"
homepage = "https://github.com/PodUtils/podnet"
readme = "README.md"
keywords = ["network", "tunnel", "proxy", "warp", "sandbox"]
categories = ["network-programming", "command-line-utilities"]
# The files of the repository that the build and the tests of the crate do
# not read (#221).
exclude = [
  "/.claude",
  "/.github",
  "/CLAUDE.md",
  "/docs",
  "/fuzz",
  "/notebooks",
  "/scripts",
  "/TODO",
  "/cliff.toml",
  "/deny.toml",
]

# Linux only (docs/decisions.md): docs.rs builds one target.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[workspace]
# crates/podnet-todo checks the work record in TODO/ (`cargo todo`). It is
# not a default member: no release builds it.
members = [
  ".",
  "crates/podnet-core",
  "crates/podnet-netns",
  "crates/podnet-serve",
  "crates/podnet-todo",
  "crates/podnet-vnet",
]
exclude = ["fuzz"]
default-members = [".", "crates/podnet-core", "crates/podnet-netns", "crates/podnet-serve", "crates/podnet-vnet"]

[workspace.package]
version = "0.4.0-beta.7"

# The switch of the publish to crates.io (.github/workflows/publish.yml).
# false: each run is a dry run. It stays false while the ruling "Publish no
# real version yet" is in force (docs/decisions.md).
[workspace.metadata.podnet]
crates-io = false

[lib]
name = "podnet"
path = "src/lib.rs"

[[bin]]
name = "podnet"
path = "src/main.rs"

[dependencies]
podnet-core = { path = "crates/podnet-core", version = "0.4.0-beta.7" }
podnet-netns = { path = "crates/podnet-netns", version = "0.4.0-beta.7" }
podnet-serve = { path = "crates/podnet-serve", version = "0.4.0-beta.7" }
podnet-vnet = { path = "crates/podnet-vnet", version = "0.4.0-beta.7" }
# TLS of PodUtils/podcrates: the roots, the client configurations and the
# split of the ClientHello, with podnet's settings (src/trust.rs), on ring.
pod-tls = { git = "https://github.com/PodUtils/podcrates", tag = "v0.32.0", version = "0.32.0" }
# The HTTP date of a time (the log of detach, the tests of the clock); the
# dial, the resolver and the failures of pod-proxy.
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.32.0", version = "0.32.0" }
# The way out of each TCP connection (src/egress.rs: the proxies, Digest, the
# race of addresses, the proxy of a tool's file), the HTTP client
# (src/fetch.rs) and the credentials of a served proxy, of PodUtils/podcrates,
# with podnet's settings.
pod-proxy = { git = "https://github.com/PodUtils/podcrates", tag = "v0.32.0", version = "0.32.0" }
# The resolver of each direct dial (src/resolve.rs): an IP address, the pins
# of --resolve, the system and DNS over HTTPS, with podnet's settings.
pod-dns = { git = "https://github.com/PodUtils/podcrates", tag = "v0.32.0", version = "0.32.0" }
# The services of other parties: the relay, the edge of Cloudflare's tunnels
# and its roots, the quick tunnels, WARP, 1.1.1.1 and Pinggy, as data with
# their sources.
pod-services = { git = "https://github.com/PodUtils/podcrates", tag = "v0.32.0", version = "0.32.0" }
# The WebSocket of `connect`, of the forward endpoint and their bridge
# (src/ws.rs), of PodUtils/podcrates, with podnet's dial, TLS context and
# user agent, and the limits of tokio-tungstenite.
pod-ws = { git = "https://github.com/PodUtils/podcrates", tag = "v0.32.0", version = "0.32.0" }
# QUIC (the edge, QUIC over WARP, MASQUE over HTTP/3) on noq, of
# PodUtils/podcrates: the endpoints and their keys in pure Rust, and the
# socket over the UDP of the userspace stack under WARP (src/warp/quic.rs).
pod-quic = { git = "https://github.com/PodUtils/podcrates", tag = "v0.32.0", version = "0.32.0" }
# The ioctl number of TUNSETIFF for the target (src/warp/tun.rs), of the
# hold of PodUtils/podcrates (podnet-netns has its core).
pod-hold = { git = "https://github.com/PodUtils/podcrates", tag = "v0.32.0", version = "0.32.0" }
# The WireGuard initiator of WARP, sans I/O, of PodUtils/podcrates: the
# handshake, the cookie, the transport messages and the timers of
# src/warp/wg.rs, on ring.
pod-wg = { git = "https://github.com/PodUtils/podcrates", tag = "v0.32.0", version = "0.32.0" }
# The client of the WebSocket-to-TCP relay of PodUtils/podcrates
# (src/ws_relay.rs, src/relay_reverse.rs): the hosts, their pool and their
# failover, the tokens, the pairs, the node and the operator of the reverse
# road. plain-ws: http:// and ws:// to a relay on the loopback, as podnet
# took them before (a stand-in relay of the tests); a host off the loopback
# stays refused before any connection.
pod-relay = { git = "https://github.com/PodUtils/podcrates", tag = "v0.32.0", version = "0.32.0", features = ["pair", "plain-ws"] }
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
# X25519 of warp export (issue 148); already in the tree through ssh-key.
curve25519-dalek = { version = "5", default-features = false }
futures = "0.3"
getrandom = "0.4"
h2 = "0.4"
httparse = "1"
http = "1"
http-body-util = "0.1"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
# The QUIC stack of pod-quic (podcrates call C43): no default feature, so no
# ring and no aws-lc in it; its keys are pod-quic's.
noq = { version = "1.4", default-features = false, features = ["runtime-tokio", "rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
# The path: of an ingress rule is a regular expression, as in cloudflared
# (Go RE2). The regex crate has the same syntax and linear time.
regex = "1"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pki-types = "1"
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
ring = "0.17"
# The feature rsa verifies the RSA host key of a relay (Pinggy; T-318).
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
ssh-key = { version = "0.7.0-rc.11", features = ["getrandom"] }
hickory-resolver = { version = "0.26", default-features = false, features = [
    "tokio",
    "system-config",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The userspace TCP and UDP stack of PodUtils/podcrates: the WireGuard
# network (src/networks/wg.rs) runs a stack over its tunnel.
# The feature ipv4-fragmentation (T-248): a UDP datagram to IPv4 holds up to
# 65507 bytes in both directions over each MTU (a guest wire). Each interface
# of smoltcp in the binary holds a buffer of 64 KiB for the fragments that it
# sends, and smoltcp puts together one datagram at a time.
pod-netstack = { git = "https://github.com/PodUtils/podcrates", tag = "v0.32.0", version = "0.32.0", features = ["ipv4-fragmentation"] }
# The version of pod-netstack of PodUtils/podcrates: WARP (src/warp/ip.rs)
# drives its link device (vnet::device) with it.
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    # The congestion controllers of issue 134 (podnet warp --cc).
    "socket-tcp-reno",
    "socket-tcp-cubic",
    # 32 out-of-order ranges in a TCP receive buffer (the default is 4):
    # a large window with loss keeps the data after a hole (issue 100).
    "assembler-max-segment-count-32",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-util",
    "io-std",
    "net",
    "time",
    "sync",
    "signal",
    "fs",
    "process",
] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "1"
x509-parser = "0.18"

[dev-dependencies]
# The responder of the tests of WireGuard (src/warp/wg/standin.rs).
pod-wg = { git = "https://github.com/PodUtils/podcrates", tag = "v0.32.0", version = "0.32.0", features = ["standin"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
