# `cargo todo check` reads the work record in TODO/; `cargo todo set T-NNN
# STATUS` moves a status and derives the counts; `cargo todo next` gives the
# next free id; `cargo todo remap FILE` moves the citations of an edited file
# (TODO/RULES.md).
[alias]
todo = "run -q -p podnet-todo --"

# podnet's userspace stack (pod-netstack of PodUtils/podcrates) owns the
# local address, the gateway (where the virtual resolver listens), their IPv6
# counterparts, and each address that a virtual listener binds (a --forward
# to 10.66.0.3). smoltcp defaults IFACE_MAX_ADDR_COUNT to 2, so raise it:
# pod-netstack fails a build with less than 8.
[env]
SMOLTCP_IFACE_MAX_ADDR_COUNT = "8"

# A new entry of Cargo.lock takes the newest version of a crate that builds
# with the rust-version of the workspace.
[resolver]
incompatible-rust-versions = "fallback"
