name: ci

# The checks of each push to main and each pull request:
#
# * test: format, clippy, the tests, the man page.
# * restricted-host: the tests with bind(AF_INET) refused.
# * no-loopback: the tests in a network namespace with the loopback down.
# * msrv: the workspace builds with the rust-version of Cargo.toml.
# * static: static musl binaries for x86_64 and aarch64, with their sizes.
# * workflows: the rules of scripts/check-workflows.py, and the size of the
#   Rust files (scripts/check-size.py).
# * record: the tests of the checker of the work record (crates/podnet-todo),
#   and `cargo todo check` (TODO/RULES.md).
# * plant: each check above must fail on a planted fault.
# * all: the one status to require. It fails when a job failed or was
#   skipped.
#
# Each action is pinned by its commit. No job may write to the repository.

on:
  push:
    branches: [main]
  pull_request:
  # A run by hand, when a push starts no workflow.
  workflow_dispatch:

permissions:
  contents: read

env:
  # The toolchain of each job but msrv. Change it here only.
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: never

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sh scripts/retry.sh rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      # T-152: the row of the netfilter probe on the runner (a measure; it
      # does not fail the job).
      - name: Netfilter in a namespace (pod doctor)
        run: ./target/debug/podnet pod doctor | grep -i netfilter || true
      # T-250: the netns tests that skip for a user here (no user namespace)
      # run as root: the veth wire and the kernel mode of the router. A skip
      # line fails the step.
      - name: Netns tests as root
        run: sh scripts/ci/root-netns-tests.sh
      # #213: rustdoc with no warning (a broken link renders as plain text
      # on docs.rs).
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --workspace
      # #221: the files of each package. No publish (docs/decisions.md), but
      # a packaging defect shows here, not at the first publish.
      - name: Package lists
        run: |
          set -eu
          # The lists go outside the checkout: a new file there makes the
          # next cargo package refuse a dirty tree.
          out="$RUNNER_TEMP"
          # Each member of the workspace that cargo may publish (T-046).
          members=$(cargo metadata --locked --no-deps --format-version 1 | python3 -I -c '
          import json, sys
          for p in json.load(sys.stdin)["packages"]:
              if p["publish"] != []:
                  print(p["name"])')
          test -n "$members"
          for p in $members; do
            cargo package --locked --list -p "$p" > "$out/pkg-$p.txt"
            for f in LICENSE README.md Cargo.toml; do
              grep -qx "$f" "$out/pkg-$p.txt" || { echo "$p: no $f in the package"; exit 1; }
            done
          done
          for f in podnet-vnet.c podnet-socks.c fakepwd.c tsgetent tsid; do
            grep -qx "shim/$f" "$out/pkg-podnet-vnet.txt" || { echo "podnet-vnet: no shim/$f in the package"; exit 1; }
          done
          if grep -E '^(\.github|\.claude|docs|scripts|fuzz|TODO)/|^(err\.txt|CLAUDE\.md)$' "$out/pkg-podnet.txt"; then
            echo "files of the repository in the package"; exit 1
          fi
      - name: The man page renders with groff and mandoc
        run: |
          set -eu
          sh scripts/retry.sh sudo apt-get install -y -qq groff mandoc > /dev/null
          cargo run --locked -q --bin podnet -- man --roff > podnet.1
          groff -man -Tutf8 -ww -z podnet.1 2> groff.log || true
          if [ -s groff.log ]; then cat groff.log; exit 1; fi
          mandoc -T lint -W error podnet.1
          mandoc -T utf8 podnet.1 | head -20

  # #217: the tests on a host that refuses bind(AF_INET). Each test binary
  # has an LD_PRELOAD object that makes bind() of AF_INET and AF_INET6 fail
  # with EACCES (scripts/restricted-host.sh). A test that needs the
  # loopback skips; no test fails or waits for a time limit.
  restricted-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sh scripts/retry.sh rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Test with bind(AF_INET) refused
        run: sh scripts/restricted-host.sh
      # The plant: a loopback test with no skip must fail, with EACCES.
      - name: The check fails on its plant
        run: |
          set -u
          sed -i '/fn the_probe_splits_open_and_closed_ports/{n;/need_loopback/d}' crates/podnet-core/src/ports.rs
          git diff --quiet -- crates/podnet-core/src/ports.rs && { echo "the plant did not change crates/podnet-core/src/ports.rs"; exit 1; }
          if sh scripts/restricted-host.sh --lib ports::tests::the_probe_splits_open_and_closed_ports > "$RUNNER_TEMP/plant.log" 2>&1; then
            cat "$RUNNER_TEMP/plant.log"
            echo "the planted test passed"
            exit 1
          fi
          grep -m1 PermissionDenied "$RUNNER_TEMP/plant.log" || { cat "$RUNNER_TEMP/plant.log"; echo "the plant failed for another cause"; exit 1; }
          git checkout -- crates/podnet-core/src/ports.rs

  # T-076: the tests in a network namespace with the loopback down, as the
  # runner user. A test that binds 127.0.0.1 must skip with need_loopback!().
  no-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sh scripts/retry.sh rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Build the tests
        run: cargo test --workspace --no-run
      - name: Test with the loopback down
        run: |
          set -eu
          sudo unshare -n -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env HOME="$HOME" PATH="$PATH" CARGO_TERM_COLOR=never \
            cargo test --offline --workspace
      # The plant: a loopback test with no skip must fail.
      - name: The check fails on its plant
        run: |
          set -u
          sed -i '/fn the_probe_splits_open_and_closed_ports/{n;/need_loopback/d}' crates/podnet-core/src/ports.rs
          git diff --quiet -- crates/podnet-core/src/ports.rs && { echo "the plant did not change crates/podnet-core/src/ports.rs"; exit 1; }
          if sudo unshare -n -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env HOME="$HOME" PATH="$PATH" \
            cargo test --offline --lib ports::tests::the_probe_splits_open_and_closed_ports > "$RUNNER_TEMP/plant.log" 2>&1; then
            cat "$RUNNER_TEMP/plant.log"
            echo "the planted test passed"
            exit 1
          fi
          grep -m1 "test result: FAILED" "$RUNNER_TEMP/plant.log" || { cat "$RUNNER_TEMP/plant.log"; echo "the plant failed for another cause"; exit 1; }
          git checkout -- crates/podnet-core/src/ports.rs

  # The rust-version of Cargo.toml builds the workspace. It is the Rust of
  # pod-tls (PodUtils/podcrates), the toolchain of CI: no stable API is newer,
  # so a planted call of a newer API cannot fail, and there is no such plant.
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain of rust-version
        run: |
          set -eu
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test -n "$msrv" || { echo "Cargo.toml has no rust-version"; exit 1; }
          sh scripts/retry.sh rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - name: Check with rust-version
        run: cargo +"$MSRV" check --locked --workspace

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: test
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sh scripts/retry.sh rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -t ${{ matrix.target }}
          rustup default "$RUST_TOOLCHAIN"
      - name: Install the C cross compilers
        run: |
          sh scripts/retry.sh sudo apt-get update -qq
          sh scripts/retry.sh sudo apt-get install -y -qq clang lld musl-tools gcc-aarch64-linux-gnu > /dev/null
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: clang
          CC_aarch64_unknown_linux_musl: clang
          CFLAGS_aarch64_unknown_linux_musl: --target=aarch64-linux-musl
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: The binaries are static, and their sizes
        run: |
          set -eu
          sh scripts/check-static.sh target/${{ matrix.target }}/release/podnet
          {
            echo "| ${{ matrix.target }} | bytes |"
            echo "| --- | ---: |"
            for b in podnet; do
              echo "| $b | $(wc -c < target/${{ matrix.target }}/release/$b) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Package
        run: |
          mkdir dist
          for bin in podnet; do
            cp target/${{ matrix.target }}/release/$bin dist/$bin-${{ matrix.target }}
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podnet-${{ matrix.target }}
          path: dist/*

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The rules of the workflows
        run: python3 scripts/check-workflows.py
      # 800 lines for each Rust file, or the count of scripts/size-allow.txt,
      # which can only go down. The self-test plants each fault first.
      - name: The size of the Rust files
        run: |
          python3 -I scripts/check-size.py --self-test
          python3 -I scripts/check-size.py
      # T-010: no module refers to a crate that its crate may not use, but the
      # rows of scripts/layers-allow.txt, which can only shrink.
      - name: The layers of the modules
        run: |
          python3 -I scripts/check-layers.py --self-test
          python3 -I scripts/check-layers.py
      # #246: the shell scripts have no shellcheck warning.
      - name: shellcheck
        run: |
          set -eu
          shellcheck --version | head -2
          shellcheck -S warning scripts/*.sh scripts/*/*.sh

  # The work record (TODO/): the tests of its checker, then the check of
  # the record. The checker has no dependency.
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Toolchain
        run: |
          sh scripts/retry.sh rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: The tests of the checker
        run: cargo test --locked -p podnet-todo
      - name: The record agrees (cargo todo check)
        run: cargo run --locked -q -p podnet-todo -- check
      - name: The last commit left no citation unmoved
        run: cargo run --locked -q -p podnet-todo -- check --base HEAD~1

  # #214: clippy of the newest stable Rust. A new lint of a new Rust does
  # not stop a release (the pinned toolchain decides); this job shows it.
  clippy-stable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sh scripts/retry.sh rustup toolchain install stable --profile minimal -c clippy
          rustup default stable
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # Each check must be able to fail. A planted fault, in a scratch copy, must
  # make its check fail; the job fails when a check passes on its plant.
  plant:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sh scripts/retry.sh rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: The checks fail on their plants
        run: |
          set -u
          fail=0
          must_fail() {
            what=$1
            shift
            if "$@" > "$RUNNER_TEMP/plant.log" 2>&1; then
              echo "FAIL $what: the check passed"
              cat "$RUNNER_TEMP/plant.log"
              fail=1
            else
              echo "ok   $what: $(tail -1 "$RUNNER_TEMP/plant.log")"
            fi
          }
          w="$RUNNER_TEMP/workflows"

          # --locked with a Cargo.lock that is out of date.
          sed -i '0,/^version = "/s/^version = "\(.*\)"/version = "\1-planted"/' Cargo.toml
          must_fail "cargo --locked, Cargo.lock out of date" cargo metadata --locked --format-version 1
          git checkout -- Cargo.toml

          # A binary with dynamic dependencies.
          must_fail "check-static.sh, a dynamic binary" sh scripts/check-static.sh /bin/ls

          # A job with no timeout-minutes.
          rm -rf "$w"; cp -r .github/workflows "$w"
          sed -i '0,/^    timeout-minutes:/{/^    timeout-minutes:/d}' "$w/ci.yml"
          must_fail "check-workflows.py, a job with no timeout-minutes" python3 scripts/check-workflows.py "$w"

          # An action pinned to a tag.
          rm -rf "$w"; cp -r .github/workflows "$w"
          sed -i '0,/actions\/checkout@[0-9a-f]\{40\}/s//actions\/checkout@v7/' "$w/ci.yml"
          must_fail "check-workflows.py, an action on a tag" python3 scripts/check-workflows.py "$w"

          # The test job with a right to write.
          rm -rf "$w"; cp -r .github/workflows "$w"
          sed -i 's/^  test:$/  test:\n    permissions:\n      contents: write/' "$w/ci.yml"
          must_fail "check-workflows.py, the test job may write" python3 scripts/check-workflows.py "$w"

          # A workflow that may write at the top level.
          rm -rf "$w"; cp -r .github/workflows "$w"
          sed -i '0,/^  contents: read$/s//  contents: write/' "$w/ci.yml"
          must_fail "check-workflows.py, write at the top level" python3 scripts/check-workflows.py "$w"

          # A number of TODO/github.txt that TODO/issues.md does not map.
          sed -i '/^89 issue open$/d' TODO/github.txt
          git diff --quiet -- TODO/github.txt && { echo "the plant did not change TODO/github.txt"; exit 1; }
          must_fail "cargo todo check, a number dropped from TODO/github.txt" cargo run --locked -q -p podnet-todo -- check
          git checkout -- TODO/github.txt

          # An entry whose row in TODO/INDEX.md has another status.
          sed -i '0,/^\*\*Status:\*\* blocked$/s//**Status:** open/' TODO/deferred.md
          git diff --quiet -- TODO/deferred.md && { echo "the plant did not change TODO/deferred.md"; exit 1; }
          must_fail "cargo todo check, a status that differs from its row" cargo run --locked -q -p podnet-todo -- check
          git checkout -- TODO/deferred.md

          # An allowlisted Rust file that grew, and a new file over 800 lines.
          f=$(awk '!/^#/ && NF { print $2; exit }' scripts/size-allow.txt)
          echo '// planted' >> "$f"
          must_fail "check-size.py, an allowlisted file that grew" python3 -I scripts/check-size.py
          git checkout -- "$f"
          seq 801 | sed 's|^|// |' > src/planted_size.rs
          must_fail "check-size.py, a new file over 800 lines" python3 -I scripts/check-size.py
          rm src/planted_size.rs

          # A core module that uses an adapter, and a scan of nothing.
          echo 'use crate::tunnel;' >> crates/podnet-core/src/udp.rs
          must_fail "check-layers.py, a reference from core to cloudflare" python3 -I scripts/check-layers.py
          git checkout -- crates/podnet-core/src/udp.rs
          echo 'use crate::tunnel;' >> crates/podnet-serve/src/gate.rs
          must_fail "check-layers.py, a reference from serve to cloudflare" python3 -I scripts/check-layers.py
          git checkout -- crates/podnet-serve/src/gate.rs
          must_fail "check-layers.py, a scan of nothing" python3 -I scripts/check-layers.py --plant-empty

          exit "$fail"

  all:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [test, restricted-host, no-loopback, msrv, static, workflows, record, plant]
    if: always()
    steps:
      - name: Each job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
