          HOME="$home" sh -c '. "$HOME/.profile"; test "$HTTPS_PROXY" = http://127.0.0.1:40100'
          # warp exec: the program has no proxy variables, the pod carries it.
          target/release/podnet warp exec -- sh -c 'test -z "${HTTPS_PROXY:-}" && curl -fsS --max-time 30 https://www.cloudflare.com/cdn-cgi/trace' | grep -q '^warp=on'
          # Issue 85: SSH to github.com with TCP 22 dropped on the host,
          # through warp nc (WARP) and through warp nc --via-relay. The
          # server answers at the key step: the SSH handshake went through.
          sudo iptables -A OUTPUT -p tcp --dport 22 -j DROP
          for nc in "warp nc" "warp nc --via-relay"; do
            out=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              -o ProxyCommand="$PWD/target/release/podnet $nc %h %p" -T git@github.com 2>&1 || true)
            echo "$nc: $out" | tail -1
            echo "$out" | grep -q 'Permission denied (publickey)'
          done
          # Issue 115: warp nc -u through the running warp up.
          python3 -c "import sys; sys.stdout.buffer.write(bytes.fromhex('567801000001000000000000') + b'\x07example\x03com\x00\x00\x01\x00\x01')" |
            timeout 30 target/release/podnet warp nc -u 1.1.1.1 53 | head -c 2 | od -An -tx1 | tee nc-udp-up.txt
          grep -q '56 78' nc-udp-up.txt
          # Issue 82: the agent doctor sees SSH fail direct and work
          # through the running warp up.
          target/release/podnet doctor --agent --json > agent.json
          jq -e '.warp_up == true' agent.json
          jq -e '.rows[] | select(.task == "git (SSH)") | .direct != "ok" and .warp == "ok"' agent.json
          jq -e '.rows[] | select(.task == "git (HTTPS)") | .warp == "ok"' agent.json
          target/release/podnet doctor --agent
          sudo iptables -D OUTPUT -p tcp --dport 22 -j DROP
          target/release/podnet warp ssh-config --host github.com | grep -q 'ProxyCommand .* warp nc %h %p'
          # Issue 130: the block in a config file; ssh reads it.
          conf="$RUNNER_TEMP/ssh130/config"
          target/release/podnet warp ssh-config --write --host github.com --config "$conf"
          ssh -G -F "$conf" github.com | grep -i '^proxycommand .*warp nc' | sed -E "s#'[^']*'#<podnet>#"
          target/release/podnet warp ssh-config --check --host github.com --config "$conf"
          target/release/podnet warp ssh-config --remove --config "$conf"
          if target/release/podnet warp ssh-config --check --host github.com --config "$conf"; then exit 1; fi
          # A second warp up is the same instance.
          HOME="$home" target/release/podnet warp --identity "$ident" up --port 40100 | tail -1 | jq -e --argjson pid "$(jq .pid up.json)" '.pid == $pid'
          # Issue 86: a bundle with one root (as of a proxy that terminates
          # TLS) in SSL_CERT_FILE: warp up names a merged bundle in the env
          # file, and curl through WARP works with it.
          awk '/BEGIN CERTIFICATE/{n++} n==1' /etc/ssl/certs/ca-certificates.crt > "$RUNNER_TEMP/one-root.pem"
          SSL_CERT_FILE="$RUNNER_TEMP/one-root.pem" HOME="$home" target/release/podnet warp --identity "$ident" up --port 40100 > /dev/null
          grep -q "export SSL_CERT_FILE='$PODNET_RUN_DIR/warp-ca.pem'" "$PODNET_RUN_DIR/warp.env"
          test "$(grep -c 'BEGIN CERTIFICATE' "$PODNET_RUN_DIR/warp-ca.pem")" -gt 10
          (
            eval "$(target/release/podnet warp env)"
            curl -fsS --max-time 30 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on'
          )
          HOME="$home" target/release/podnet warp down
          ! grep -q 'podnet warp up' "$home/.profile" "$home/.bashrc"
          grep -q 'export KEEP=1' "$home/.profile"
          ! target/release/podnet warp env
      # Issue 87: one command on a host with port 22 and the edge port 7844
      # dropped: WARP starts, a local server gets a public URL, git over
      # SSH works through WARP; agent down removes each part.
      - name: agent up and down
        timeout-minutes: 6
        run: |
          set -eu
          export PODNET_RUN_DIR="$RUNNER_TEMP/run-agent"
          home="$RUNNER_TEMP/home-agent"
          mkdir -p "$home/srv"
          echo 'served by agent up' > "$home/srv/index.html"
          python3 -m http.server 18096 --bind 127.0.0.1 --directory "$home/srv" > /dev/null 2>&1 &
          sudo iptables -A OUTPUT -p tcp --dport 22 -j DROP
          sudo iptables -A OUTPUT -p tcp --dport 7844 -j DROP
          sudo iptables -A OUTPUT -p udp --dport 7844 -j DROP
          trap 'sudo iptables -D OUTPUT -p tcp --dport 22 -j DROP; sudo iptables -D OUTPUT -p tcp --dport 7844 -j DROP; sudo iptables -D OUTPUT -p udp --dport 7844 -j DROP' EXIT
          # Issue 119: port 18097 has no origin: no tunnel for it. Issue
          # 173: a failed expose exits 69, with the document on stdout.
