name: live

# podnet against the real Cloudflare edge and WARP, on each push to main, each
# day, and by hand. No pull request runs it. The public log holds no tunnel
# host and no WARP device id: scripts/live-run.sh masks them. After two
# failed runs in a row, the job report opens one issue, and no second one
# while that issue is open.
#
# Inputs of a run by hand: plant=fail makes the run fail at once, to test
# the report; dry_run=true (and each plant) only prints what the report
# would do.

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      plant:
        description: "fail: make this run fail, to test the report"
        required: false
        default: ""
      dry_run:
        description: "true: the report changes nothing"
        required: false
        default: "false"

permissions:
  contents: read

# A planted run has its own group, so that it does not wait for (or cancel)
# a real run.
concurrency:
  group: ${{ inputs.plant != '' && format('live-plant-{0}', github.run_id) || 'live' }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: never
  RUST_LOG: podnet=info

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: A planted failure
        if: inputs.plant == 'fail'
        timeout-minutes: 1
        run: |
          echo "plant=fail: this run fails on purpose"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ::add-mask:: commands of scripts/live-run.sh are on its stdout.
      - name: No step drops the masks
        timeout-minutes: 1
        run: |
          if grep -nE 'live-run\.sh .*>[ ]*/dev/null' .github/workflows/live.yml; then
            echo "a step sends the output of live-run.sh to /dev/null: the masks are lost"
            exit 1
          fi
      - name: Toolchain
        timeout-minutes: 5
        run: |
          sh scripts/retry.sh rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Build
        timeout-minutes: 20
        run: cargo build --locked --release --bin podnet
      # The edge facts of docs/protocol.md section 6 (issue 14).
      - name: Edge facts
        timeout-minutes: 4
        run: sh tools/edge-facts.sh
      # podnet doctor (issue 11): on the runner each leg can work.
      - name: podnet doctor
        timeout-minutes: 3
        run: |
          set -eu
          target/release/podnet doctor
          target/release/podnet doctor --json > doctor.json
          for leg in quic http2 quic+warp; do
            jq -e --arg leg "$leg" '.legs[] | select(.leg == $leg) | .status == "ok"' doctor.json
          done
          # Issue 128: the roads, the clock and the DNS answers.
          jq -c '.roads[] | {road, status}' doctor.json
          for road in direct warp relay; do
            jq -e --arg road "$road" '.roads[] | select(.road == $road) | .status == "ok"' doctor.json
          done
          jq -e '.clock.status == "ok"' doctor.json
          jq -e '.paths[] | select(.id == "api") | .dns.addresses | length > 0' doctor.json
      - name: Quick tunnel, QUIC (UDP 7844)
        timeout-minutes: 4
        run: sh scripts/live-run.sh quic target/release/podnet demo --exit-on-verify --protocol quic --transport direct
      - name: Quick tunnel, HTTP/2 (TCP 7844)
        timeout-minutes: 4
        run: sh scripts/live-run.sh h2 target/release/podnet demo --exit-on-verify --protocol http2 --transport direct
      - name: Quick tunnel, JSON lines (--json)
        timeout-minutes: 4
        run: |
          set -eu
          sh scripts/live-run.sh json target/release/podnet demo --exit-on-verify --json
          jq -e 'select(.event == "ready") | .url | test("^https://.*\\.trycloudflare\\.com$")' json.out
          jq -e 'select(.event == "ready") | .leg | test("^(quic|http2|quic\\+warp|http2\\+relay)$")' json.out
          jq -e 'select(.event == "verified") | .url | test("trycloudflare")' json.out
          # Issue 94: the resolver step that resolves the new name.
          jq -r 'select(.event == "verified") | "verified dns=\(.dns)"' json.out
          jq -e 'select(.event == "verified") | .dns | test("^(system|doh|pin|none)$")' json.out
      # Issue 101: a SIGTERM right after the ready line, during the verify
      # of the public URL, is a clean stop (exit 0), not exit 143.
      - name: SIGTERM between the ready line and the verify
        timeout-minutes: 3
        run: |
          set -eu
          target/release/podnet tunnel --hello-world --run-for 60 --json > sig.out 2> sig.err &
          pid=$!
          i=0
          until grep -q '"event":"ready"' sig.out; do
            i=$((i + 1)); [ "$i" -lt 600 ] || { echo "no ready line"; exit 1; }
            sleep 0.1
          done
          kill -TERM "$pid"
          rc=0; wait "$pid" || rc=$?
          echo "exit $rc"
          grep -c '"event":"verified"' sig.out || true
          test "$rc" = 0
          grep 'SIGTERM: stopping' sig.err
      # --detach (issues 70-72): the start returns with the ready document,
      # the URL answers, the instance outlives the shell, and stop ends it.
      - name: Quick tunnel with --detach, ps, logs and stop
        timeout-minutes: 4
        run: |
          set -eu
          export PODNET_RUN_DIR="$RUNNER_TEMP/run"
          sh scripts/live-run.sh detach timeout 120 target/release/podnet tunnel --hello-world --detach --name live
          url=$(tail -1 detach.out | jq -r .url)
          pid=$(tail -1 detach.out | jq -r .pid)
          test "$(tail -1 detach.out | jq -r .verified)" = true
          # The runner can fail one connect just after the verify of podnet
          # (curl exit 7 in 2 ms): try again.
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 "$url" | grep -q 'Hello, world'
          target/release/podnet ps --json | jq -e '.instances[] | select(.name == "live") | .state == "ready"'
          kill -0 "$pid"
          target/release/podnet logs live -n 5 > /dev/null
          target/release/podnet stop live
          ! kill -0 "$pid" 2> /dev/null
          target/release/podnet ps --json | jq -e '.instances | length == 0'
      # Issue 205: --auth-user in front of a quick tunnel. No credential and
      # a wrong one get 401 from podnet; the right one gets the origin.
      - name: Quick tunnel with --auth-user
        timeout-minutes: 4
        run: |
          set -eu
          export PODNET_RUN_DIR="$RUNNER_TEMP/run"
          umask 077
          pass="$RUNNER_TEMP/auth-pass"
          head -c 18 /dev/urandom | base64 > "$pass"
          echo "::add-mask::$(cat "$pass")"
          sh scripts/live-run.sh auth timeout 120 target/release/podnet tunnel --hello-world --auth-user live --auth-password-file "$pass" --detach --name auth
          url=$(tail -1 auth.out | jq -r .url)
          code() { curl -sS --retry 5 --retry-all-errors --retry-delay 2 -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code "$url")" = 401
          test "$(code -u live:wrong "$url")" = 401
          test "$(code -u "live:$(cat "$pass")" "$url")" = 200
          curl -fsS -u "live:$(cat "$pass")" "$url" | grep -q 'Hello, world'
          target/release/podnet stop auth
      # UDP 7844 dropped: --protocol auto registers over HTTP/2 after the
      # stagger, and the log names the leg that won.
      - name: Quick tunnel with UDP 7844 dropped (HTTP/2 fallback)
        timeout-minutes: 4
        run: |
          set -eu
          sudo iptables -I OUTPUT -p udp --dport 7844 -j DROP
          sh scripts/live-run.sh udpdrop target/release/podnet demo --exit-on-verify
          grep 'the leg won the race' udpdrop.err
          grep -q 'leg=http2' udpdrop.err
      - name: Remove the UDP rule
        if: always()
        timeout-minutes: 1
        run: sudo iptables -D OUTPUT -p udp --dport 7844 -j DROP || true
      # The UDP probe (issue 12): the edge answers it; a REJECT rule makes it
      # refused, and then --protocol auto does not try QUIC on UDP 7844.
      - name: UDP probe, answered and refused
        timeout-minutes: 4
        run: |
          set -eu
          target/release/podnet net doctor | tee doctor.out
          grep -E '^UDP egress .* ok +answered' doctor.out
          sudo iptables -I OUTPUT -p udp --dport 7844 -j REJECT
          trap 'sudo iptables -D OUTPUT -p udp --dport 7844 -j REJECT' EXIT
          target/release/podnet net doctor | grep -E '^UDP egress .* fail +refused'
          sh scripts/live-run.sh udpreject target/release/podnet demo --exit-on-verify
          grep 'the UDP probe was refused' udpreject.err
          grep -q 'leg=http2' udpreject.err
      # Each connection of podnet goes through a local CONNECT proxy, which
      # counts its targets.
      - name: Quick tunnel through a local CONNECT proxy
        timeout-minutes: 4
        run: |
          set -eu
          python3 -I scripts/connect-proxy.py 18080 "$RUNNER_TEMP/connect.log" &
          sleep 1
          HTTPS_PROXY=http://127.0.0.1:18080 sh scripts/live-run.sh viaproxy target/release/podnet demo --exit-on-verify
          grep -q 'no proxy carries UDP' viaproxy.err
          sed -E 's/[a-z0-9-]+\.trycloudflare\.com/<tunnel>.trycloudflare.com/' "$RUNNER_TEMP/connect.log" | sort | uniq -c
          grep -q '^api.trycloudflare.com:443$' "$RUNNER_TEMP/connect.log"
          grep -q ':7844$' "$RUNNER_TEMP/connect.log"
          grep -q '\.trycloudflare\.com:443$' "$RUNNER_TEMP/connect.log"
          # Issue 129: the same proxy at the stdin and the stdout of a
          # command (one nc for each connection).
          : > "$RUNNER_TEMP/connect.log"
          sh scripts/live-run.sh viaexec target/release/podnet --proxy 'http+exec:nc 127.0.0.1 18080' demo --exit-on-verify
          grep -q '^api.trycloudflare.com:443$' "$RUNNER_TEMP/connect.log"
          grep -c ':7844$' "$RUNNER_TEMP/connect.log" | sed 's/^/edge connections through the command: /'
      # The rate of a GET and a POST on the HTTP path, through podnet connect,
      # and through a WebSocket client in Python (issue 51).
      - name: Throughput of the HTTP path and of a --forward WebSocket
        timeout-minutes: 15
        run: |
          set -eu
          sh scripts/retry.sh sudo python3 -m pip install -q --break-system-packages websockets || true
          sh scripts/live-throughput.sh target/release/podnet quic 16
          sh scripts/live-throughput.sh target/release/podnet http2 16
      # Issue 92: share uploads of 20 and 64 MiB on each leg give 200 and
      # the file; a request over --max-request gets 413; the session stays.
      - name: Large share uploads, QUIC and HTTP/2
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/live-share.sh target/release/podnet quic "20 64"
          sh scripts/live-share.sh target/release/podnet http2 "20 64"
      # Issue 56: a WebSocket through a --url origin, on each leg.
      - name: WebSocket through a --url origin
        timeout-minutes: 6
        run: |
          set -eu
          sh scripts/live-ws-url.sh target/release/podnet quic
          sh scripts/live-ws-url.sh target/release/podnet http2
      # Issue 32: 1, 4 and 16 MiB over QUIC inside WARP, and the tunnel must
      # still answer after them.
      - name: Throughput through WARP, 1 to 16 MiB
        timeout-minutes: 15
        run: sh scripts/live-throughput.sh target/release/podnet quic "1 4 16" warp
      # No system resolver: names come from DNS over HTTPS by IP address.
      # Then with Cloudflare's DoH addresses blocked, from Google's.
      - name: Quick tunnel with no system DNS, then with 1.1.1.1 blocked
        timeout-minutes: 10
        run: |
          set -eu
          set -x
          restore() {
            sudo cp "$RUNNER_TEMP/nsswitch.conf" /etc/nsswitch.conf
            sudo rm -f /etc/resolv.conf
            sudo cp -P "$RUNNER_TEMP/resolv.conf" /etc/resolv.conf
            sudo iptables -D OUTPUT -d 1.1.1.1 -j REJECT 2> /dev/null || true
            sudo iptables -D OUTPUT -d 1.0.0.1 -j REJECT 2> /dev/null || true
            sudo systemctl unmask --runtime systemd-resolved || true
            sudo systemctl start systemd-resolved || true
          }
          sudo cp -P /etc/resolv.conf "$RUNNER_TEMP/resolv.conf"
          sudo cp /etc/nsswitch.conf "$RUNNER_TEMP/nsswitch.conf"
          trap restore EXIT
          # NSS starts systemd-resolved again on demand: mask it, and keep
          # only files and dns (the dead server below) for host names.
          sudo systemctl mask --runtime systemd-resolved
          sudo systemctl stop systemd-resolved
          sudo sed -i 's/^hosts:.*/hosts: files dns/' /etc/nsswitch.conf
          sudo rm -f /etc/resolv.conf
          echo "nameserver 192.0.2.1" | sudo tee /etc/resolv.conf > /dev/null
          if timeout 15 getent hosts api.trycloudflare.com; then echo "the system resolver still answers"; exit 1; fi
          # The resolver is pod-dns (T-137): its debug line "resolved" names
          # the source of the answer (source="doh").
          RUST_LOG=podnet=debug,pod_dns=debug sh scripts/live-run.sh dns timeout 180 target/release/podnet demo --exit-on-verify --protocol http2 ||
            { tail -40 dns.err; exit 1; }
          grep 'pod_dns' dns.err | head -10 || true
          grep -q 'source="doh"' dns.err
          sudo iptables -A OUTPUT -d 1.1.1.1 -j REJECT
          sudo iptables -A OUTPUT -d 1.0.0.1 -j REJECT
          # With the servers of 1.1.1.1 refused, the DoH answer comes from
          # another operator: the debug line "doh answered" of pod_dns::way
          # names the server (pod-dns v0.6.0; COORD-004, PodUtils/podnet#322).
          RUST_LOG=podnet=debug,pod_dns=debug sh scripts/live-run.sh dns2 timeout 240 target/release/podnet demo --exit-on-verify --protocol http2 ||
            { tail -40 dns2.err; exit 1; }
          grep 'pod_dns' dns2.err | head -10 || true
          grep -q 'source="doh"' dns2.err
          # pod-dns writes the server with no quotes (server=https://8.8.8.8/...).
          grep -qE 'server="?https://8\.8\.' dns2.err
      - name: A wrong --resolve pin fails at the TLS name check
        timeout-minutes: 2
        run: |
          set -u
          if sh scripts/live-run.sh pin timeout 60 target/release/podnet --resolve api.trycloudflare.com=8.8.8.8 demo --exit-on-verify; then
            echo "a wrong pin was accepted"; exit 1
          fi
          grep -E 'NotValidForName|not valid for' pin.err
      # podnet update against the real release v0.4.0-beta.1 of podnet: the
      # download, the Fulcio chain, the check of the identity and the
      # install run. A release of cfrs stays refused.
      - name: podnet update to v0.4.0-beta.1
        timeout-minutes: 6
        run: |
          set -eu
          d="$RUNNER_TEMP/update"
          mkdir -p "$d"
          cp target/release/podnet "$d/podnet"
          "$d/podnet" update --check
          if timeout 300 "$d/podnet" update --version v0.3.0-beta.1 2> "$d/update.err"; then
            echo "podnet installed a release of cfrs"; exit 1
          fi
          cat "$d/update.err"
          grep -q 'not https://github.com/PodUtils/podnet/' "$d/update.err"
          cmp "$d/podnet" target/release/podnet
          # This build can have the version of the release: --force installs
          # it anyway, and keeps this build as podnet.prev.
          timeout 300 "$d/podnet" update --version v0.4.0-beta.1 --force
          "$d/podnet" --version | grep -q '^podnet 0.4.0-beta.1'
          cmp "$d/podnet.prev" target/release/podnet
          # --rollback (no network) swaps the binary and podnet.prev. The
          # kept binary is a copy of this build with one more byte.
          cp target/release/podnet "$d/podnet.prev"
          printf x >> "$d/podnet.prev"
          "$d/podnet" update --rollback
          "$d/podnet" --version | grep -q '^podnet '
          cmp "$d/podnet.prev" target/release/podnet
          if cmp -s "$d/podnet" target/release/podnet; then echo "no swap"; exit 1; fi
      # podnet autostart with a systemd user manager (issue 23): systemd starts
      # a quick tunnel, the URL answers, and no token is in the unit or in ps.
      - name: Autostart with a systemd user unit
        timeout-minutes: 9
        run: |
          set -eu
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          i=0
          until systemctl --user show-environment > /dev/null 2>&1; do
            i=$((i + 1)); [ "$i" -lt 30 ] || { echo "no user manager"; exit 1; }; sleep 1
          done
          mkdir -p "$HOME/.local/bin"
          cp target/release/podnet "$HOME/.local/bin/podnet"
          podnet=$HOME/.local/bin/podnet
          "$podnet" autostart add live -- tunnel --hello-world --json
          token=eyJhIjoiYWNjb3VudCIsInQiOiJ0dW5uZWwiLCJzIjoic2VjcmV0In0=
          TUNNEL_TOKEN=$token "$podnet" autostart add secret -- status --proxy=http://u:pw@127.0.0.1:9
          i=0
          until journalctl --user -u podnet-live -o cat 2> /dev/null | grep -q '"event":"ready"'; do
            i=$((i + 1)); [ "$i" -lt 90 ] || { systemctl --user status podnet-live | tail -5; exit 1; }; sleep 1
          done
          url=$(journalctl --user -u podnet-live -o cat | grep '"event":"ready"' | tail -1 | jq -r .url)
          echo "::add-mask::${url#https://}"
          # Issue 119: the resolver of the runner keeps a negative answer
          # for a new quick-tunnel name (run 41849329729).
          sh scripts/live-wait-name.sh "${url#https://}" 240
          i=0
          until curl -fsS --max-time 10 "$url/" | grep -q 'Hello, world'; do
            i=$((i + 1)); [ "$i" -lt 30 ] || { echo "the URL of the unit does not answer"; exit 1; }; sleep 2
          done
          echo "systemd started the quick tunnel, and its URL answers"
          systemctl --user is-active podnet-live
          if systemctl --user cat podnet-secret podnet-live | grep -E "$token|pw@"; then echo "a secret is in a unit"; exit 1; fi
          if ps auxww | grep -v grep | grep -E "$token|pw@"; then echo "a secret is in ps"; exit 1; fi
          stat -c '%a %n' "$HOME"/.local/state/podnet/autostart/*.env
          test "$(stat -c %a "$HOME/.local/state/podnet/autostart/secret.env")" = 600
          "$podnet" autostart remove live
          "$podnet" autostart remove secret
          if systemctl --user cat podnet-live > /dev/null 2>&1; then echo "the unit is still there"; exit 1; fi
          test -z "$(ls "$HOME/.local/state/podnet/autostart")"
      - name: Quick tunnel, QUIC through WARP (TCP 443)
        timeout-minutes: 5
        run: sh scripts/live-run.sh warpleg target/release/podnet demo --exit-on-verify --protocol quic --transport warp
      # UDP and TCP 7844 dropped with no answer: the staggered race starts
      # WARP after two 2 s steps, not after the serial time limits.
      - name: Quick tunnel with UDP and TCP 7844 dropped (staggered legs)
        timeout-minutes: 5
        run: |
          set -eu
          sudo iptables -A OUTPUT -p udp --dport 7844 -j DROP
          sudo iptables -A OUTPUT -p tcp --dport 7844 -j DROP
          trap 'sudo iptables -D OUTPUT -p udp --dport 7844 -j DROP; sudo iptables -D OUTPUT -p tcp --dport 7844 -j DROP' EXIT
          # The doctor names the legs that cannot work, and quic+warp can.
          target/release/podnet doctor --samples 3 || true
          target/release/podnet doctor --samples 3 --json > doctor-drop.json || true
          jq -e '.legs[] | select(.leg == "quic+warp") | .status == "ok"' doctor-drop.json
          jq -e '.legs[] | select(.leg == "http2") | .status != "ok"' doctor-drop.json
          jq -e '.legs[] | select(.leg == "quic") | .status != "ok"' doctor-drop.json
          sh scripts/live-run.sh race timeout 240 target/release/podnet demo --exit-on-verify ||
            { tail -40 race.err; exit 1; }
          grep 'the leg won the race' race.err
          grep -q 'leg=quic+warp' race.err
      # The WebSocket-to-TCP relay (--transport relay): UDP and TCP 7844 are
      # dropped on the host, so the HTTP/2 leg must go in a WebSocket to the
      # relay on TCP 443. podnet mints the relay token itself; no log has it.
      - name: Quick tunnel through the WebSocket relay (7844 dropped)
        timeout-minutes: 5
        run: |
          set -eu
          sudo iptables -A OUTPUT -p udp --dport 7844 -j DROP
          sudo iptables -A OUTPUT -p tcp --dport 7844 -j DROP
          trap 'sudo iptables -D OUTPUT -p udp --dport 7844 -j DROP; sudo iptables -D OUTPUT -p tcp --dport 7844 -j DROP' EXIT
          target/release/podnet demo --check --transport relay | tee relay-check.out
          grep -q 'http2+relay' relay-check.out
          sh scripts/live-run.sh relay timeout 240 target/release/podnet demo --exit-on-verify --transport relay ||
            { tail -40 relay.err; exit 1; }
          grep -q 'leg=http2+relay' relay.err
          grep -q 'registered over HTTP/2' relay.err
          ! grep -E 'ephm1\.' relay.out relay.err
      # Issue 88: SSH into this runner through the reverse relay: a pair, a
      # detached node for 127.0.0.1:22, and ssh with a ProxyCommand of podnet
      # relay connect. The host key check is on (StrictHostKeyChecking=yes).
      - name: SSH through the reverse relay
        timeout-minutes: 5
        run: |
          set -eu
          command -v sshd > /dev/null || sh scripts/retry.sh sudo apt-get install -y -q openssh-server
          sudo systemctl start ssh || sudo service ssh start
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/relay_key"
          cat "$RUNNER_TEMP/relay_key.pub" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          export PODNET_RUN_DIR="$RUNNER_TEMP/relay-run"
          target/release/podnet relay pair --json > pair.json
          name=$(jq -r .name pair.json)
          token=$(jq -r .connect_token pair.json)
          echo "::add-mask::$name"
          echo "::add-mask::$token"
          target/release/podnet relay node "$name" --to 127.0.0.1:22 --detach --name relaynode | tail -1 | jq -c '{target}'
          echo "$name $(cut -d' ' -f1,2 /etc/ssh/ssh_host_ed25519_key.pub)" > "$RUNNER_TEMP/relay_known"
          export PODNET_RELAY_CONNECT_TOKEN="$token"
          ssh -i "$RUNNER_TEMP/relay_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/relay_known" -o HostKeyAlias="$name" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ProxyCommand="$PWD/target/release/podnet relay connect $name" \
            "$USER@$name" 'echo relay-ssh-ok; uname -s' | tee relayssh.out
          grep -qx relay-ssh-ok relayssh.out
          # Two sessions at the same time through the one node.
          for i in 1 2; do
            ssh -i "$RUNNER_TEMP/relay_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/relay_known" -o HostKeyAlias="$name" \
              -o HostKeyAlgorithms=ssh-ed25519 \
              -o ProxyCommand="$PWD/target/release/podnet relay connect $name" \
              "$USER@$name" "echo parallel-$i" > "relay-$i.out" &
          done
          wait
          grep -qx parallel-1 relay-1.out
          grep -qx parallel-2 relay-2.out
          # Issue 109: an input that ends at once still gets the answer
          # (the SSH banner of the target).
          printf 'SSH-2.0-podnet-live\r\n' | timeout 30 target/release/podnet relay connect "$name" > banner.out || true
          grep -q '^SSH-2.0-' banner.out
          echo "relay connect: the answer came after the end of the input"
          # Issue 119: the ready document names the pair; relay stop stops
          # the node instance too.
          target/release/podnet ps --json | jq -e '.instances[] | select(.name == "relaynode") | .ready.pair' > /dev/null
          target/release/podnet relay stop "$name" | sed "s/$name/<pair>/"
          if target/release/podnet ps --json | jq -e '.instances[] | select(.name == "relaynode")' > /dev/null; then
            echo "the node instance runs after relay stop"; exit 1
          fi
      - name: WARP account and probe
        timeout-minutes: 4
        run: |
          set -eu
          sh scripts/live-run.sh register target/release/podnet warp register
          sh scripts/live-run.sh status target/release/podnet warp status
          sh scripts/live-run.sh probe timeout 120 target/release/podnet warp probe
          grep 'OK          udp 1.1.1.1:53' probe.out
          # Issue 115: warp nc -u with no warp up: a DNS query and its answer
          # (the id 0x1234 comes back).
          python3 -c "import sys; sys.stdout.buffer.write(bytes.fromhex('123401000001000000000000') + b'\x07example\x03com\x00\x00\x01\x00\x01')" |
            timeout 60 target/release/podnet warp nc -u 1.1.1.1 53 | head -c 2 | od -An -tx1 | tee nc-udp.txt
          grep -q '12 34' nc-udp.txt
      # The second name of the WARP API (owner ruling of 2026-11-04): a
      # device registers, reads its status and is deleted through
      # api.devices.cloudflare.com only (PODNET_WARP_API). Exit 75 (error
      # 1015, the limit of new devices for each address) skips the step.
      - name: WARP API through its second host
        timeout-minutes: 3
        run: |
          set -eu
          export PODNET_WARP_API=https://api.devices.cloudflare.com
          ident="$RUNNER_TEMP/second-api.json"
          rc=0; timeout 60 target/release/podnet warp --identity "$ident" register 2> second-reg.err || rc=$?
          if [ "$rc" = 75 ] && grep -q 1015 second-reg.err; then
            echo "the WARP service limits new devices for this address (1015): skipped"; exit 0
          fi
          tail -3 second-reg.err
          test "$rc" = 0
          rc=0; timeout 60 target/release/podnet warp --identity "$ident" status > second-status.out 2>&1 || rc=$?
          rc2=0; timeout 60 target/release/podnet warp --identity "$ident" delete 2> second-del.err || rc2=$?
          echo "status: exit $rc; delete: exit $rc2"
          grep -E '^(type|account)' second-status.out || true
          test "$rc" = 0
          test "$rc2" = 0
