          grep -q 'with root: sudo podnet warp up --tun' up106.err
          ! grep -q 'warp proxy --detach' up106.err
      # Issue 76: TCP 443 to the MASQUE front doors is dropped; the WARP
      # client falls back to the WebSocket relay, with the same pinned key.
      - name: WARP probe through the WebSocket relay (MASQUE TCP dropped)
        timeout-minutes: 4
        run: |
          set -eu
          sudo iptables -A OUTPUT -p tcp -d 162.159.198.0/24 --dport 443 -j DROP
          trap 'sudo iptables -D OUTPUT -p tcp -d 162.159.198.0/24 --dport 443 -j DROP' EXIT
          sh scripts/live-run.sh warprelay timeout 180 target/release/podnet warp probe ||
            { tail -30 warprelay.err; exit 1; }
          grep -q 'MASQUE goes through the WebSocket relay' warprelay.err
          ! grep -E 'ephm1\.' warprelay.out warprelay.err
      # Issue 78: one warp up; later shells join it with warp env, warp
      # exec and the --persist block; warp down removes each change.
      # Issue 97: the host refuses the TCP listener of warp up (here a
      # program holds the port: EADDRINUSE). warp up starts with the unix
      # socket only; warp env exits 69 (no proxy port); warp exec works.
      - name: warp up with its TCP listener refused
        timeout-minutes: 4
        run: |
          set -eu
          export PODNET_RUN_DIR="$RUNNER_TEMP/run-up97"
          ident="$HOME/.local/state/podnet/warp.json"
          python3 -c "import socket, time; s = socket.socket(); s.bind(('127.0.0.1', 40097)); s.listen(); time.sleep(240)" &
          holder=$!
          sleep 1
          target/release/podnet warp --identity "$ident" up --port 40097 2> up97.err | tail -1 > up97.json
          jq -e '.tcp == false' up97.json
