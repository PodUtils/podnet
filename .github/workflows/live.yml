          # prints nothing on stdout.
          rc=0
          target/release/podnet warp env > env97.txt 2> env97.err || rc=$?
          test "$rc" -eq 69
          test ! -s env97.txt
          grep 'podnet warp exec' env97.err
          target/release/podnet warp exec -- curl -fsS --max-time 30 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp=on'
