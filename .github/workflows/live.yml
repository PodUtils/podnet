          jq -e '.exposed[0].state == "ready"' agent.json
          jq -e '.exposed[1].state == "origin-unreachable" and .exposed[1].url == null' agent.json
          jq -e '.mode == "warp"' agent.json
          jq -e '.works["git (SSH)"] | index("warp") != null' agent.json
          url=$(jq -r '.exposed[0].url' agent.json)
          curl -fsS --max-time 30 "$url" | grep -q 'served by agent up'
          target/release/podnet agent down
          target/release/podnet ps --json | jq -e '.instances | length == 0'
      # Issue 79: the raw IP pod. The runner limits unprivileged user
      # namespaces with AppArmor: the step allows them first. In the pod:
      # HTTPS through WARP, a UDP DNS query to 1.1.1.1, a name through the
      # resolv.conf of the pod, and IPv6.
      - name: WARP run with the netns-raw backend (TCP, UDP, IPv6, no root)
        timeout-minutes: 4
        run: |
          set -eu
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          cat > "$RUNNER_TEMP/raw-check.sh" <<'CHECK'
          set -eu
          curl -fsS --max-time 20 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp='
          python3 -c "
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(10)
          q = bytes.fromhex('1234010000010000000000000765786d706c6503636f6d0000010001'.replace('65786d706c65', '6578616d706c65'))
          s.sendto(q, ('1.1.1.1', 53)); a = s.recv(512)
          print('udp-dns', 'ok' if a[:2] == b'\x12\x34' else 'bad')
          "
          getent hosts example.com > /dev/null && echo 'resolv.conf ok'
          curl -fsS --max-time 20 'https://[2606:4700:4700::1111]/cdn-cgi/trace' | grep '^warp=' | sed 's/^/ipv6 /'
          CHECK
          sh scripts/live-run.sh rawrun timeout 120 target/release/podnet warp run --backend netns-raw -- sh "$RUNNER_TEMP/raw-check.sh" ||
            { tail -20 rawrun.err; exit 1; }
          grep -q 'the program runs in a raw pod' rawrun.err
          grep -q '^warp=on' rawrun.out
          grep -q 'udp-dns ok' rawrun.out
          grep -q 'resolv.conf ok' rawrun.out
          grep -q '^ipv6 warp=on' rawrun.out
      # Issue 77: with root, the whole host through WARP. The default routes
      # are up for a few seconds only (the runner's own connections stall
      # while they are up); stop puts back each route and the resolver.
      - name: warp tun --default-route (root), then everything as before
        timeout-minutes: 4
        run: |
          set -eu
          run=/tmp/podnet-run-root
          sudo cp /etc/resolv.conf "$RUNNER_TEMP/resolv.before"
          ip route > "$RUNNER_TEMP/routes.before"
          sudo env PODNET_RUN_DIR="$run" target/release/podnet warp --ephemeral tun --default-route --detach --name tun | tail -1 > tun.json
          jq -e '.default_route == true' tun.json
          ip route | grep 'dev podnet0'
          curl -fsS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp=on'
          python3 -c "
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(10)
          s.sendto(bytes.fromhex('123401000001000000000000076578616d706c6503636f6d0000010001'), ('1.1.1.1', 53))
          print('udp-dns', 'ok' if s.recv(512)[:2] == bytes.fromhex('1234') else 'bad')
