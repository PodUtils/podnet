[package]
name = "podnet-serve"
version.workspace = true
edition = "2021"
rust-version = "1.99"
license = "0BSD"
description = "The services of podnet: the file server, the file transfer, the gate, the ingress rules, the origins and the client of the SSH relay. A library of podnet, not a stable interface."
repository = "https://github.com/PodUtils/podnet"
homepage = "https://github.com/PodUtils/podnet"
readme = "README.md"
keywords = ["network", "tunnel", "file-server"]
categories = ["network-programming"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "podnet_serve"
path = "src/lib.rs"

[dependencies]
podnet-core = { path = "../podnet-core", version = "0.4.0-beta.11" }
# The TLS client of an origin, and the credentials of a served proxy, of
# PodUtils/podcrates at the git tag of the root.
pod-tls = { git = "https://github.com/PodUtils/podcrates", tag = "v0.46.0", version = "0.46.0" }
pod-proxy = { git = "https://github.com/PodUtils/podcrates", tag = "v0.46.0", version = "0.46.0" }
# The check of the owner and the mode of the users file of the file
# server (T-089); a crate of the workspace, at the git tag of the root.
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.46.0", version = "0.46.0" }
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
# The Basic credentials of the users of the file server (T-089).
base64 = "0.23"
bytes = "1"
futures = "0.3"
getrandom = "0.4"
http = "1"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
# The path: of an ingress rule is a regular expression, as in cloudflared
# (Go RE2). The regex crate has the same syntax and linear time.
regex = "1"
ring = "0.17"
# The feature rsa verifies the RSA host key of a relay (Pinggy; T-318).
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
# The JSON listing of the file server (T-088); a crate of the workspace.
serde_json = "1"
ssh-key = { version = "0.7.0-rc.11", features = ["getrandom"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-util",
    "io-std",
    "net",
    "time",
    "sync",
    "signal",
    "fs",
    "process",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# need_loopback! of the tests; a crate of the workspace.
pod-testkit = { git = "https://github.com/PodUtils/podcrates", tag = "v0.46.0", version = "0.46.0" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
