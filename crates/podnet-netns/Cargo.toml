[package]
name = "podnet-netns"
version.workspace = true
build = "build.rs"
edition = "2021"
rust-version = "1.99"
license = "0BSD"
description = "Run a program with all its network traffic sent through a SOCKS5, HTTP or tailnet upstream, with no LD_PRELOAD. The library of `podnet pod`."
repository = "https://github.com/PodUtils/podnet"
homepage = "https://github.com/PodUtils/podnet"
readme = "README.md"
keywords = ["proxy", "seccomp", "netns", "socks5", "sandbox"]
categories = ["network-programming"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "podnet_netns"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
# The keys of a Basic login of the door (door.rs).
base64 = "0.23"
libc = "0.2"
# The dialer and the datagrams of the front door (door.rs).
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.26.0", version = "0.26.0" }
# The SOCKS5 datagram path (UDP ASSOCIATE, the command 0x83, the frames and
# the datagram header) of PodUtils/podcrates, at the git tag of the root.
pod-proxy = { git = "https://github.com/PodUtils/podcrates", tag = "v0.27.0", version = "0.27.0" }
# The generic core of the hold of PodUtils/podcrates: the seccomp filter,
# the receive of a notification, the memory of the child, the reply, the
# table of the sockets with the flow budget, the dial state of a connect,
# the netns entry, the TUN, the veth wire and the SYN packets.
pod-hold = { git = "https://github.com/PodUtils/podcrates", tag = "v0.27.0", version = "0.27.0" }
serde_json = "1"
# The version of pod-netstack of PodUtils/podcrates, so that the binary has
# one smoltcp.
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-util",
    "net",
    "time",
    "sync",
    "signal",
] }
# The debug lines of the door (door.rs).
tracing = "0.1"

[dev-dependencies]
# need_loopback! of the tests of the door.
pod-testkit = { git = "https://github.com/PodUtils/podcrates", tag = "v0.26.0", version = "0.26.0" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
