[package]
name = "podnet-netns"
version.workspace = true
build = "build.rs"
edition = "2021"
rust-version = "1.99"
license = "0BSD"
description = "Run a program with all its network traffic sent through a SOCKS5, HTTP or tailnet upstream, with no LD_PRELOAD. The library of `podnet pod`."
repository = "https://github.com/PodUtils/podnet"
homepage = "https://github.com/PodUtils/podnet"
readme = "README.md"
keywords = ["proxy", "seccomp", "netns", "socks5", "sandbox"]
categories = ["network-programming"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "podnet_netns"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
# The SOCKS5 datagram path (UDP ASSOCIATE, the command 0x83, the frames and
# the datagram header) of PodUtils/podcrates, at the git tag of the root.
pod-proxy = { git = "https://github.com/PodUtils/podcrates", tag = "v0.10.0", version = "0.10.0" }
serde_json = "1"
smoltcp = { version = "=0.12.0", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-util",
    "net",
    "time",
    "sync",
    "signal",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
