[package]
name = "podnet-netns"
version.workspace = true
build = "build.rs"
edition = "2021"
rust-version = "1.99"
license = "0BSD"
description = "Run a program with all its network traffic sent through a SOCKS5, HTTP or tailnet upstream, with no LD_PRELOAD. The library of `podnet pod`."
repository = "https://github.com/PodUtils/podnet"
homepage = "https://github.com/PodUtils/podnet"
readme = "README.md"
keywords = ["proxy", "seccomp", "netns", "socks5", "sandbox"]
categories = ["network-programming"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "podnet_netns"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
# The keys of a Basic login of the door (door.rs).
base64 = "0.23"
libc = "0.2"
# The dialer and the datagrams of the front door (door.rs).
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0", version = "0.38.0" }
# The SOCKS5 datagram path (UDP ASSOCIATE, the command 0x83, the frames and
# the datagram header) of PodUtils/podcrates, at the git tag of the root.
pod-proxy = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0", version = "0.38.0" }
# The generic core of the hold of PodUtils/podcrates: the seccomp filter,
# the receive of a notification, the memory of the child, the reply, the
# table of the sockets with the flow budget, the dial state of a connect,
# the netns entry, the TUN, the veth wire, the SYN packets and (syn-hold)
# the hold of each SYN of the router on the stack of pod-netstack.
pod-hold = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0", version = "0.38.0", features = ["syn-hold"] }
serde_json = "1"
# The userspace stack of the router (its config, its streams): the TUN or
# the veth wire, under the hold of pod-hold. A build needs
# SMOLTCP_IFACE_MAX_ADDR_COUNT = "8" (`.cargo/config.toml` of the workspace).
pod-netstack = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0", version = "0.38.0" }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-util",
    "net",
    "time",
    "sync",
    "signal",
] }
# The debug lines of the door (door.rs).
tracing = "0.1"

[dev-dependencies]
# need_loopback! of the tests of the door.
pod-testkit = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0", version = "0.38.0" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
