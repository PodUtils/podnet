# The fuzz targets of podnet (cargo-fuzz, libFuzzer). This is its own
# workspace: the main workspace excludes it, and it needs a nightly
# toolchain and glibc (libFuzzer does not run on musl).
#
#   cargo +nightly fuzz run capnp_message -- -max_total_time=60
#
# Each target calls one function of podnet::fuzzing. .github/workflows/fuzz.yml
# runs each target each week.

[package]
name = "podnet-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "0BSD"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
podnet = { path = ".." }

[workspace]
members = ["."]

[[bin]]
name = "seed"
path = "src/seed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capnp_message"
path = "fuzz_targets/capnp_message.rs"
test = false
doc = false
bench = false

