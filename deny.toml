# cargo-deny: the advisories, licenses, duplicate versions and sources of the
# dependencies. CI runs it (.github/workflows/deny.yml). To run it by hand:
#
#   cargo deny --locked check advisories licenses bans sources

[graph]
all-features = false
# The targets of the release binaries. A crate that only another target
# compiles is in no release, and is not checked.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "armv7-unknown-linux-musleabihf",
  "riscv64gc-unknown-linux-musl",
  "i686-unknown-linux-musl",
  "arm-unknown-linux-musleabihf",
  "loongarch64-unknown-linux-musl",
  "powerpc64le-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"
# Each ignored advisory has its reason and the date it was read.
ignore = [
  # 2026-11-12 (T-326): the Marvin timing attack on RSA decryption and signing. Each russh release
  # up to 0.65.1 pins `rsa = "=0.10.0-rc.18"`, and the fix is `rsa` 0.10.0. podnet makes Ed25519
  # keys; an RSA key is used only when the user gives one. Remove this line when russh takes 0.10.0.
  { id = "RUSTSEC-2023-0071", reason = "russh pins rsa 0.10.0-rc.18; no fixed version is reachable (T-326)" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# The same list as about.toml. LGPL and GPL are not allowed: the release
# binaries are static. An entry that no crate uses now (BSD-2-Clause, #245)
# stays allowed for a later dependency; cargo deny only warns.
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates of the workspace are paths, not releases.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/PodUtils/podcrates"]
